<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Secure Flasher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Crypto JS for ESPTool -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; margin: 0; background-color: #1a1a1a; }
        .hidden { display: none !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); border-radius: 24px; }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input:focus { border-color: rgba(255, 255, 255, 0.5); outline: none; background: rgba(255, 255, 255, 0.1); }
        .glass-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.3s ease; }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-white">

    <!-- Background Video -->
    <video autoplay loop muted playsinline class="fixed top-0 left-0 w-full h-full object-cover z-[-1]">
        <source src="./bg-video.mp4" type="video/mp4">
    </video>
    <div class="fixed top-0 left-0 w-full h-full bg-black/40 z-[-1]"></div>

    <!-- Header -->
    <div class="mb-8 text-center z-10">
        <h1 class="text-4xl font-extrabold tracking-tight text-white drop-shadow-lg">R TRACK CREATION</h1>
        <p class="text-white/70 text-sm mt-2 tracking-widest uppercase">ESP32-S3 Secure Flasher</p>
    </div>

    <!-- 1. LOGIN SECTION -->
    <div id="login-section" class="w-full max-w-md glass-panel p-8 z-10 transition-all duration-500">
        <h2 class="text-2xl font-semibold mb-6 text-center">Portal Login</h2>
        <div id="error-msg" class="hidden bg-red-500/30 border border-red-500/50 rounded-xl p-3 mb-4 text-sm text-center backdrop-blur-md"></div>
        <div class="space-y-4">
            <input type="text" id="userid" placeholder="Enter ID" class="w-full glass-input rounded-xl px-4 py-3">
            <input type="password" id="password" placeholder="Enter Password" class="w-full glass-input rounded-xl px-4 py-3">
            <button id="login-btn" class="w-full glass-btn font-semibold py-3 px-4 rounded-xl mt-4">Sign In</button>
        </div>
    </div>

    <!-- 2. CUSTOMER FLASH SECTION -->
    <div id="flash-section" class="hidden w-full max-w-md glass-panel p-8 z-10">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-semibold">Ready to Flash ESP32-S3</h2>
            <p class="text-white/70 text-sm mt-1">Logged in as: <span id="display-id" class="font-bold text-white"></span></p>
        </div>

        <div class="mb-4 text-left">
            <label class="text-xs text-white/70 mb-1 block">Select Firmware Type:</label>
            <select id="board-type" class="w-full glass-input rounded-xl px-3 py-2 text-sm text-black">
                <option value="0x10000" class="text-black" selected>ESP32-S3 (App Bin - 0x10000)</option>
                <option value="0x0000" class="text-black">ESP32-S3 (Merged Bin - 0x0000)</option>
            </select>
        </div>

        <div id="status-text" class="text-sm font-medium text-blue-300 mb-4 text-center">Status: Connect ESP32-S3 via USB</div>
        
        <div id="progress-container" class="hidden w-full bg-white/10 rounded-full h-3 mb-6 border border-white/20 relative overflow-hidden">
            <div id="progress-bar" class="bg-blue-400 h-full rounded-full transition-all duration-200" style="width: 0%"></div>
        </div>
        
        <button id="action-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
            🔌 Connect & Flash ESP32-S3
        </button>
        <button id="logout-btn" class="w-full glass-btn font-medium py-2 px-4 rounded-xl mt-4 text-sm text-white/80">Logout</button>
    </div>

    <!-- 3. ADMIN PANEL SECTION -->
    <div id="admin-section" class="hidden w-full max-w-lg glass-panel p-8 z-10 max-h-[90vh] overflow-y-auto">
        <h2 class="text-2xl font-semibold mb-6 text-center text-white">Admin Dashboard</h2>
        <div class="bg-white/5 p-5 rounded-2xl mb-6 border border-white/10">
            <h3 class="text-sm font-semibold mb-3">Add New Customer</h3>
            <div class="flex gap-2 mb-2">
                <input type="text" id="new-userid" placeholder="User ID" class="w-1/2 glass-input rounded-xl px-3 py-2 text-sm">
                <input type="text" id="new-password" placeholder="Password" class="w-1/2 glass-input rounded-xl px-3 py-2 text-sm">
            </div>
            <button id="add-user-btn" class="w-full glass-btn font-semibold py-2 px-4 rounded-xl text-sm">Create User</button>
        </div>
        <div class="bg-white/5 p-5 rounded-2xl mb-6 border border-white/10">
            <h3 class="text-sm font-semibold mb-3">User Status Tracking</h3>
            <ul id="user-list" class="text-sm space-y-2 max-h-40 overflow-y-auto pr-2"></ul>
        </div>
        <button id="admin-logout-btn" class="w-full glass-btn text-white/80 font-semibold py-2 px-4 rounded-xl text-sm">Logout Admin</button>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.3.1/lib/index.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz54wzbxLE3kRTQbjUK9hkiAksALk7LJ8",
            authDomain: "oled-flasher-by-r-track.firebaseapp.com",
            databaseURL: "https://oled-flasher-by-r-track-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "oled-flasher-by-r-track",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let currentUserId = "";
        const ADMIN_ID = "roobesh";
        const ADMIN_PASS = "09112007@";

        const loginSec = document.getElementById('login-section');
        const flashSec = document.getElementById('flash-section');
        const adminSec = document.getElementById('admin-section');
        const errorMsg = document.getElementById('error-msg');

        // LOGIN SYSTEM FIXED
        document.getElementById('login-btn').addEventListener('click', async () => {
            const uid = document.getElementById('userid').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            if(!uid || !pass) { 
                showError("Please enter ID and Password"); 
                return; 
            }
            
            const btn = document.getElementById('login-btn');
            btn.innerText = "Checking...";

            try {
                // 1. Admin Login Check
                if(uid === ADMIN_ID && pass === ADMIN_PASS) {
                    console.log("Admin logged in successfully");
                    loginSec.classList.add('hidden'); 
                    adminSec.classList.remove('hidden'); 
                    loadAdminData(); 
                    btn.innerText = "Sign In";
                    return;
                }

                // 2. Customer Login Check via Firebase
                const userRef = ref(db, 'users/' + uid);
                const snapshot = await get(userRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if(userData.password === pass) {
                        if(userData.status === "FLASHED") {
                            showError("Access Denied: Already flashed.");
                        } else {
                            currentUserId = uid;
                            document.getElementById('display-id').innerText = uid;
                            loginSec.classList.add('hidden');
                            flashSec.classList.remove('hidden');
                        }
                    } else {
                        showError("Incorrect Password!");
                    }
                } else {
                    showError("User ID not found!");
                }
            } catch (err) {
                console.error("Login Error:", err);
                showError("Connection error. Check Firebase Rules (.read/.write = true)");
            }
            btn.innerText = "Sign In";
        });

        function showError(msg) { 
            errorMsg.innerText = msg; 
            errorMsg.classList.remove('hidden'); 
        }

        // ADD USER
        document.getElementById('add-user-btn').addEventListener('click', async () => {
            const nUid = document.getElementById('new-userid').value.trim();
            const nPass = document.getElementById('new-password').value.trim();
            
            if(nUid && nPass) {
                try {
                    await set(ref(db, 'users/' + nUid), { password: nPass, status: "PENDING" });
                    document.getElementById('new-userid').value = ""; 
                    document.getElementById('new-password').value = "";
                    alert("Customer created successfully!");
                } catch(e) {
                    alert("Failed to create user. Check Firebase Rules.");
                }
            } else {
                alert("Enter both ID and Password");
            }
        });

        function loadAdminData() {
            onValue(ref(db, 'users'), (snapshot) => {
                const list = document.getElementById('user-list'); 
                list.innerHTML = "";
                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const statusColor = data.status === "FLASHED" ? "text-green-400" : "text-yellow-400";
                        list.innerHTML += `<li class="flex justify-between items-center bg-white/5 p-3 rounded-lg border border-white/10">
                            <div>
                                <span class="font-bold text-blue-300">${child.key}</span>
                                <span class="text-xs text-white/50 ml-2">Pass: ${data.password}</span>
                            </div>
                            <span class="text-xs font-bold ${statusColor}">${data.status}</span></li>`;
                    });
                } else {
                    list.innerHTML = "<li class='text-center text-white/50'>No users found.</li>";
                }
            });
        }

        // ESP32-S3 FLASHING
        document.getElementById('action-btn').addEventListener('click', async () => {
            const statusText = document.getElementById('status-text');
            const actionBtn = document.getElementById('action-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            
            const flashAddress = parseInt(document.getElementById('board-type').value, 16);

            if (!navigator.serial) { 
                alert("Use Google Chrome or Edge browser on PC."); 
                return; 
            }

            let port;
            try {
                port = await navigator.serial.requestPort();
                
                actionBtn.classList.add('hidden');
                progressContainer.classList.remove('hidden');
                statusText.innerText = "Status: Downloading firmware...";
                
                const response = await fetch("./oled_file_v1.bin");
                if (!response.ok) throw new Error("Firmware file 'oled_file_v1.bin' not found in GitHub repository!");
                const binData = await response.arrayBuffer();
                const fileArray = new Uint8Array(binData);
                
                statusText.innerText = "Status: Connecting to ESP32-S3...";
                progressBar.style.width = "10%";

                const transport = new Transport(port);
                const esploader = new ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: { clean: () => {}, writeLine: (msg) => console.log(msg) }
                });

                await esploader.main_fn();
                statusText.innerText = `Status: Flashing ESP32-S3...`;
                
                await esploader.write_flash({
                    fileArray: [{ data: fileArray, address: flashAddress }],
                    flashSize: "keep",
                    eraseAll: false,
                    compress: true,
                    reportProgress: (fileIndex, written, total) => {
                        const progress = Math.round((written / total) * 100);
                        progressBar.style.width = progress + "%";
                        statusText.innerText = `Status: Flashing... ${progress}%`;
                    }
                });

                statusText.innerText = "Status: Rebooting device...";
                await esploader.hard_reset();
                await transport.disconnect();

                await update(ref(db, `users/${currentUserId}`), { status: "FLASHED" });
                
                statusText.className = "text-sm font-bold text-green-400 mb-4 text-center";
                statusText.innerText = "Success! ESP32-S3 flashed successfully.";
                
                setTimeout(() => { window.location.reload(); }, 4000);
                
            } catch (error) {
                statusText.className = "text-sm font-bold text-red-400 mb-4 text-center";
                statusText.innerText = "Error: Flashing failed. Check console for details.";
                console.error(error);
                if (port) { try { await port.close(); } catch(e){} }
                actionBtn.classList.remove('hidden');
                progressContainer.classList.add('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => window.location.reload());
        document.getElementById('admin-logout-btn').addEventListener('click', () => window.location.reload());
    </script>
</body>
</html>
